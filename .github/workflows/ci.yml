name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true # Enormer Speed-Boost für Folgeruns

      - name: Install dependencies
        # --locked bricht ab, wenn uv.lock nicht mehr zur pyproject.toml passt
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Type Check (Pyright)
        run: uv run pyright .

      - name: Run Tests
        run: uv run pytest
